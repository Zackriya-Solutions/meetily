[package]
name = "meetily"
version = "0.5.0"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Zackriya-Solutions/meeting-minutes"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# Hardware acceleration features for whisper-rs
# Cross-platform GPU acceleration with smart defaults
#
# BUILD INSTRUCTIONS:
# ===================
# macOS:     cargo build --release              (Metal GPU auto-enabledon)
#
# Windows:   cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features vulkan  (AMD/Intel GPU)
#
# Linux:     cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features hipblas (AMD GPU with ROCm)
#            cargo build --release --features vulkan  (Other GPUs)
#
# QUICK START: Use the helper scripts!
#   ./build-gpu.sh (Unix/macOS)
#   .\build-gpu.ps1 (Windows PowerShell)
#
[features]
default = ["custom-protocol", "platform-default"]  # Bundled frontend + best backend per platform

# Enables bundled frontend assets for raw release executables.
# Tauri CLI normally provides this for production builds, but executable-only
# cargo builds need it explicitly to avoid loading the devUrl localhost server.
custom-protocol = ["tauri/custom-protocol"]

# Platform-appropriate defaults - see target-specific dependencies below
platform-default = []

# Manual GPU acceleration options (for power users to override defaults)
metal = ["whisper-rs/metal"]       # macOS: Apple Metal GPU (Auto-enabled on macOS)
coreml = ["whisper-rs/coreml"]     # macOS: Apple CoreML acceleration
cuda = ["whisper-rs/cuda"]         # Windows/Linux: NVIDIA CUDA GPU
vulkan = ["whisper-rs/vulkan"]     # Windows/Linux: AMD/Intel Vulkan GPU
hipblas = ["whisper-rs/hipblas"]   # Linux: AMD ROCm HIP

# CPU optimizations (fallback for systems without GPU)
openblas = ["whisper-rs/openblas"] # Optimized BLAS (Auto-enabled on Windows/Linux)
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
zip = "2.2"           # ZIP extraction (Windows, macOS)
tar = "0.4"           # TAR extraction (Linux)
xz2 = "0.1"           # XZ decompression (Linux)
sha2 = "0.10"


[dependencies]
serde_json = "1.0"
sha2 = "0.10"         # yt-dlp download checksum verification
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
posthog-rs = "0.3.7"

# Cross-platform audio capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"


# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
# Fork decision (upstream 0.5.0 merge, 2026-11-17): upstream dropped
# env_logger for tauri-plugin-log; this fork keeps env_logger for its file
# log under the data root, panic hook and build banner (main.rs).
env_logger = "0.11"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"


# Speech recognition and async utilities
# NOTE: whisper-rs is declared in platform-specific sections below (macOS/Windows/Linux)
# to ensure correct GPU features are enabled per platform
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Parakeet (ONNX-based fast transcription) dependencies
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
thiserror = "2.0.16"                # Error handling for Parakeet

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
# CancellationToken, plus `codec` for FramedRead so batch uploads stream from
# disk instead of buffering a ~29 MB chunk in memory.
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# Gemini Live WebSocket transport (hermes gateway).
# native-tls matches reqwest 0.11's default backend (schannel on Windows), so
# this does not link a second TLS stack into the binary.
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories
dirs = "5.0.1"

# sha2 (declared above) also verifies copies during the one-time storage migration.

# Additional dependencies for notification system
url = "2.5.0"
# Opens external links in the default browser: upstream's open_external_url,
# and the Teams join link ("Join and record" in the calendar nudge;
# docs/CALENDAR_MEETING_DETECTION_SPEC.md).
open = { version = "5.3.3", features = ["shellexecute-on-windows"] }


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"

# Desktop-only single instance guard
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.3.7"

# macOS-specific dependencies with Metal GPU acceleration
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon", "devtools"] }
once_cell = "1.17.1"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["multipart", "json"] }
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
futures-channel = "0.3.31"

# PERFORMANCE: Enable Metal GPU + CoreML acceleration automatically on macOS
# CoreML provides additional acceleration for Apple Silicon chips
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

# Windows-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
webview2-com = "0.38.2"
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
futures-channel = "0.3.31"
windows = { version = "0.61.3", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # GetLastInputInfo / GetTickCount: idle gating for the automatic pipeline
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    # EnumWindows / GetWindowTextW: Teams meeting window title capture
    "Win32_UI_WindowsAndMessaging",
    # IDispatch::Invoke, GetActiveObject: classic Outlook calendar via COM
    "Win32_System_Ole",
] }

# Linux-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features hipblas  (AMD ROCm)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"

# Native PipeWire/PulseAudio client for system-audio capture (bypasses cpal's
# ALSA-only host on Linux, no ~/.asoundrc setup required)
libpulse-binding = "2.30.1"

[dev-dependencies]
# Test-only: lets unit tests build a mock AppHandle (tauri::test::mock_app)
# for commands and stop/import paths that take one. Resolver 2 keeps this
# feature out of release builds.
tauri = { version = "2.6.2", features = ["test"] }
# Contract tests for the Gemini batch gateway: asserts the exact multipart
# fields and status->error mapping without spending real quota.
wiremock = "0.6"
tempfile = "3.3.0"

# NOTE: [profile.*] lives in the workspace root Cargo.toml. Cargo ignores
# profiles declared in a non-root member and only warns about it.

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }
