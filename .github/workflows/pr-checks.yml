name: PR Checks

# The repository previously had no automatic PR validation — every other
# workflow here is workflow_dispatch or workflow_call, so nothing ran on a pull
# request. This is the gate.
#
# System dependencies come from scripts/linux-deps.txt, the same file
# scripts/review-env-setup.sh reads, so CI and a contributor's machine cannot
# drift apart. Add a package there, not here.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The ort crate downloads a prebuilt ONNX Runtime; keep it out of the source tree.
  ORT_PREFER_DYNAMIC_LINK: "0"

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # NOT GATED, deliberately - both are broken on an untouched checkout and
      # neither is this branch's to fix:
      #
      #   pnpm run lint      `next lint` under Next 14 does not understand the
      #                      flat-config eslint.config.mjs in this repo (that is
      #                      Next 15 style), so it falls through to an
      #                      INTERACTIVE "How would you like to configure
      #                      ESLint?" prompt and fails in CI. eslint,
      #                      eslint-config-next and @eslint/eslintrc are not
      #                      dependencies at all, so the config could not load
      #                      even if it were found. The script has never worked.
      #
      #   tsc --noEmit       one pre-existing error: tests/lib/
      #                      blocknote-markdown.test.ts imports 'bun:test' and
      #                      no bun types are installed. Not in the Next build
      #                      graph, so it does not affect the app.
      #
      # `next build` is the real type gate and it covers the application code:
      # tsconfig sets strict: true and next.config.js does not set
      # typescript.ignoreBuildErrors.
      - name: Build
        working-directory: frontend
        run: pnpm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the changed-file format check can diff against the base.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # Single source of truth — see scripts/linux-deps.txt
          PACKAGES="$(grep -vE '^\s*(#|$)' scripts/linux-deps.txt | tr '\n' ' ')"
          echo "Installing: $PACKAGES"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PACKAGES

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Build llama-helper sidecar
        # tauri.conf.json declares bundle.externalBin, and tauri_build::build()
        # hard-fails if the binary is missing for the host triple — so cargo
        # check/clippy/test cannot run at all without this. build.rs fetches
        # ffmpeg itself; llama-helper is not automatic. Debug build, because
        # nothing in these checks executes the sidecar; it only has to exist.
        run: |
          cargo build -p llama-helper
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p frontend/src-tauri/binaries
          cp "target/debug/llama-helper" "frontend/src-tauri/binaries/llama-helper-${TRIPLE}"

      - name: Format (new files only)
        run: |
          # MEASURED BASELINE: `cargo fmt --check` reports 1062 diffs on an
          # untouched checkout. The tree has never been rustfmt-clean.
          #
          # Two traps found the hard way, both on this workflow's first run:
          #
          #  1. rustfmt FOLLOWS `mod` DECLARATIONS. Checking a changed mod.rs
          #     recurses into every sibling module, so "changed files only"
          #     silently re-checked the whole subtree. `skip_children` stops it.
          #     (It is a --config option; there is no --skip-children flag.)
          #
          #  2. File-level scoping is still too coarse. A one-line doc-comment
          #     edit to a file makes that file's PRE-EXISTING formatting our
          #     problem, forcing an unrelated whole-file reformat that buries
          #     the real change — the exact outcome this scoping exists to avoid.
          #
          # So the gate covers ADDED files only, where "all of it is ours" is
          # true by construction. Modified files are reported as advisory and
          # do not fail the build.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "Not a pull request; skipping."
            exit 0
          fi
          FMT="rustfmt --edition 2021 --config skip_children=true --check"

          ADDED="$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '*.rs' || true)"
          MODIFIED="$(git diff --name-only --diff-filter=M "$BASE"...HEAD -- '*.rs' || true)"

          if [ -n "$MODIFIED" ]; then
            echo "::group::Advisory: formatting in modified files (not gated)"
            # shellcheck disable=SC2086
            $FMT $MODIFIED || true
            echo "::endgroup::"
          fi

          if [ -z "$ADDED" ]; then
            echo "No new Rust files; nothing to gate."
            exit 0
          fi
          echo "Gating formatting of new files:"; echo "$ADDED" | sed 's/^/  /'
          # shellcheck disable=SC2086
          $FMT $ADDED

      - name: Clippy (advisory - NOT a gate)
        working-directory: frontend/src-tauri
        # MEASURED BASELINE on an untouched checkout: 168 warnings and 2
        # deny-by-default ERRORS, so `cargo clippy` fails outright here - not
        # merely under `-D warnings`:
        #
        #   audio/capture/backend_config.rs:55   inherent `to_string` shadows Display
        #   audio/system_audio_commands.rs:123   assert!(len() >= 0) is always true
        #
        # Both are real bugs and both are two-line fixes, but they are unrelated
        # to this branch and correcting repo code from an infrastructure PR
        # widens it. Clippy therefore reports and does not gate. Turning it into
        # a real gate is a good follow-up: fix those two, then decide whether
        # the 168 warnings get fixed or allow-listed.
        run: cargo clippy --all-targets 2>&1 | tail -40 || true

      - name: Check
        # The strongest Rust gate that is honest on this tree: it PASSES on an
        # untouched checkout once the sidecar exists, so a failure here is
        # genuinely the PR's fault.
        working-directory: frontend/src-tauri
        run: cargo check --all-targets

      - name: Test (advisory - NOT a gate)
        working-directory: frontend/src-tauri
        # MEASURED BASELINE on an untouched checkout: 185 pass, 2 FAIL.
        #
        #   audio::device_detection::tests::test_calculate_buffer_timeout_bluetooth
        #     assert_eq! on Durations derived from float maths:
        #     159.999996ms != 160ms. A real test bug; fails anywhere.
        #
        #   audio::incremental_saver::tests::test_checkpoint_creation
        #     "FFmpeg not found" - needs the ffmpeg sidecar resolvable at RUN
        #     time, and find_ffmpeg_path looks beside the executable rather
        #     than in binaries/.
        #
        # Neither is this branch's, and skipping named tests to force green is
        # quarantining, which this branch does not do. So the suite reports and
        # does not gate. Fixing both is a well-scoped follow-up that would let
        # this become a real gate - the first needs a tolerance instead of
        # assert_eq!, the second needs test-time ffmpeg resolution.
        #
        # Also covers the compiled doctest at src/summary/templates/mod.rs.
        run: cargo test 2>&1 | tail -30 || true
