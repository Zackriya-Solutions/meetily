# SOTTOLY: CI propio. Los workflows heredados de Meetily son manuales y no corren aquí.
name: Sottoly CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits of this change
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .

  engine:
    name: engine (bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  rust:
    name: cargo test
    runs-on: macos-latest   # captura de audio (cidre) y Metal solo compilan en macOS
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cmake (whisper.cpp)
        run: command -v cmake || brew install cmake
      - name: Sidecar llama-helper (Tauri lo exige como externalBin)
        run: |
          cargo build -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/debug/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - name: cargo test
        working-directory: frontend/src-tauri
        run: cargo test --no-fail-fast
