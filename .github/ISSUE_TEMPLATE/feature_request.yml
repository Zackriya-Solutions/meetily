name: Feature request
description: Suggest an improvement to Meetily.
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [issues](https://github.com/Zackriya-Solutions/meetily/issues?q=is%3Aissue) and [PRs](https://github.com/Zackriya-Solutions/meetily/pulls?q=is%3Apr) before proposing new work. If an existing request covers your idea, add useful context there instead.
        Discuss substantial features before implementing them. No implementation plan or code is required to explain a user need.
  - type: checkboxes
    id: duplicate-search
    attributes:
      label: Existing requests and implementations
      options:
        - label: I searched open and closed issues and PRs for this improvement.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What are you trying to accomplish, and what limitation do you encounter in Meetily?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the improvement and how you would know it solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Share workarounds, relevant platforms, or examples if useful. Do not include private meeting content or credentials.
  - type: input
    id: related-work
    attributes:
      label: Related issues or PRs
      description: Link related requests or implementations and explain what differs. Leave blank if none apply.
